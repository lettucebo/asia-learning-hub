name: Copilot CLI summary (POC)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
concurrency:
  group: ai-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture the PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --no-ext-diff "$BASE_SHA...$HEAD_SHA" -- industry/ > pr.diff
          git diff --name-status --no-ext-diff "$BASE_SHA...$HEAD_SHA" -- industry/ > changed-files.txt
      - name: Generate summary with custom agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm install -g @github/copilot
          copilot --agent pr-summary --model gpt-6-sol \
            -p 'Read RULE.md, .github/copilot-instructions.md, pr.diff, and changed-files.txt. Summarize and check only the changed use cases in Markdown with the format specified by this agent.' \
            -s --available-tools=view --allow-tool=read --no-ask-user > ai-summary.md
          test -s ai-summary.md
          grep -Eq '^Verdict: (PASS|FAIL)$' ai-summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: ai-summary
          path: |
            ai-summary.md
            changed-files.txt
          if-no-files-found: error
  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ai-summary
      - name: Publish CLI result as a PR review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/publish_review.py
